<h1>{{ portalName }}</h1>
<p>Browse your courses, track your grades, and manage enrollments all in one place.</p>

<button [disabled]="!isPortalActive" routerLink="/enroll" (click)="onEnrollClick()">Enroll Now</button>
<p>{{ message }}</p>

<input [(ngModel)]="searchTerm" placeholder="Search courses">
<p>Searching for: {{ searchTerm }}</p>

<!--
  [property] is one-way: data flows component -> DOM only (e.g. [disabled]).
  [(ngModel)] is two-way: DOM -> component AND component -> DOM,
  it is shorthand for [ngModel]="searchTerm" (ngModelChange)="searchTerm=$event"
-->

<div class="stats-row">
  <span>Courses Available: {{ courseCount }}</span>
  <span>Enrolled: {{ enrolledCount }}</span>
  <span>GPA: 3.8</span>
</div>

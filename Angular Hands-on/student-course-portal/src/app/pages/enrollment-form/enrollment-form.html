<form #enrollForm="ngForm" (ngSubmit)="onSubmit(enrollForm)">
  <div>
    <label for="studentName">Student Name</label>
    <input id="studentName" name="studentName" [(ngModel)]="studentName" #nameCtrl="ngModel" placeholder="Student Name" required minlength="3">
    <span *ngIf="nameCtrl.touched && nameCtrl.errors?.['required']">Name is required</span>
    <span *ngIf="nameCtrl.touched && nameCtrl.errors?.['minlength']">Name must be at least 3 characters</span>
  </div>

  <div>
    <label for="studentEmail">Email</label>
    <input id="studentEmail" name="studentEmail" type="email" [(ngModel)]="studentEmail" #emailCtrl="ngModel" placeholder="Email" required>
    <span *ngIf="emailCtrl.touched && emailCtrl.errors?.['required']">Email is required</span>
    <span *ngIf="emailCtrl.touched && emailCtrl.errors?.['email']">Enter a valid email</span>
  </div>

  <div>
    <label for="courseId">Course ID</label>
    <input id="courseId" name="courseId" type="number" [(ngModel)]="courseId" #courseIdCtrl="ngModel" placeholder="Course ID" required>
    <span *ngIf="courseIdCtrl.touched && courseIdCtrl.errors?.['required']">Course ID is required</span>
  </div>

  <div>
    <label for="preferredSemester">Preferred Semester</label>
    <select id="preferredSemester" name="preferredSemester" [(ngModel)]="preferredSemester" required>
      <option value="Odd">Odd</option>
      <option value="Even">Even</option>
    </select>
  </div>

  <div>
    <label>
      <input id="agreeToTerms" name="agreeToTerms" type="checkbox" [(ngModel)]="agreeToTerms" #agreeCtrl="ngModel" required>
      I agree to the terms
    </label>
    <span *ngIf="agreeCtrl.touched && agreeCtrl.errors?.['required']">You must agree to the terms</span>
  </div>

  <button type="submit" [disabled]="enrollForm.invalid">Submit</button>
  <button type="button" (click)="resetForm(enrollForm)">Reset</button>

  <div *ngIf="submitted">
    Enrollment request submitted successfully!
  </div>
</form>

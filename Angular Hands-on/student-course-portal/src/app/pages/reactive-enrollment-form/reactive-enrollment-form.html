<form [formGroup]="enrollForm" (ngSubmit)="onSubmit()">
  <div>
    <label for="studentName">Student Name</label>
    <input id="studentName" formControlName="studentName" placeholder="Student Name">
    <span *ngIf="studentNameCtrl.touched && studentNameCtrl.errors?.['required']">Name is required</span>
    <span *ngIf="studentNameCtrl.touched && studentNameCtrl.errors?.['minlength']">Name must be at least 3 characters</span>
  </div>

  <div>
    <label for="studentEmail">Email</label>
    <input id="studentEmail" formControlName="studentEmail" type="email" placeholder="Email">
    <span *ngIf="studentEmailCtrl.touched && studentEmailCtrl.errors?.['required']">Email is required</span>
    <span *ngIf="studentEmailCtrl.touched && studentEmailCtrl.errors?.['email']">Enter a valid email</span>
    <span *ngIf="studentEmailCtrl.pending">Checking email...</span>
    <span *ngIf="studentEmailCtrl.touched && studentEmailCtrl.errors?.['emailTaken']">Email taken</span>
  </div>

  <div>
    <label for="courseId">Course ID</label>
    <input id="courseId" formControlName="courseId" placeholder="Course ID">
    <span *ngIf="courseIdCtrl.touched && courseIdCtrl.errors?.['required']">Course ID is required</span>
    <span *ngIf="courseIdCtrl.touched && courseIdCtrl.errors?.['noCourseCode']">Course code starting with XX is not allowed</span>
  </div>

  <div>
    <label for="preferredSemester">Preferred Semester</label>
    <select id="preferredSemester" formControlName="preferredSemester">
      <option value="Odd">Odd</option>
      <option value="Even">Even</option>
    </select>
  </div>

  <div>
    <label>
      <input type="checkbox" formControlName="agreeToTerms">
      I agree to the terms
    </label>
    <span *ngIf="agreeToTermsCtrl.touched && agreeToTermsCtrl.errors?.['required']">You must agree to the terms</span>
  </div>

  <div formArrayName="additionalCourses">
    <label>Additional Courses</label>
    <div *ngFor="let ctrl of additionalCourses.controls; let i = index">
      <input [formControlName]="i" placeholder="Additional Course">
      <button type="button" (click)="removeCourse(i)">Remove</button>
      <span *ngIf="ctrl.touched && ctrl.errors?.['required']">Course is required</span>
      <span *ngIf="ctrl.touched && ctrl.errors?.['noCourseCode']">Course code starting with XX is not allowed</span>
    </div>
    <button type="button" (click)="addCourse()">Add Another Course</button>
  </div>

  <button type="submit" [disabled]="enrollForm.invalid">Submit</button>
</form>
